<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaChain Admin — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-badge">P</div>
        <span class="logo-text">PharmaChain</span>
      </div>

      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Sign in to manage the supply chain</p>

      <form id="login-form">
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@company.com">
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="error-message" class="error-message" hidden></div>

        <button type="submit" id="login-btn" class="btn-primary">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <p class="login-footer">Authorized manufacturer, distributor, and governance staff only.</p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
