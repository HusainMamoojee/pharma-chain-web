<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaChain Admin — Stakeholders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/stakeholders.css">
</head>
<body>
  <div class="dashboard-page">

    <div class="topbar">
      <div class="topbar-brand">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="9" fill="white" fill-opacity="0.15"/>
            <path d="M8 16L16 8" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M9.5 6.5L17.5 14.5C19.2 16.2 19.2 18.9 17.5 20.6C15.8 22.3 13.1 22.3 11.4 20.6L3.4 12.6C1.7 10.9 1.7 8.2 3.4 6.5C5.1 4.8 7.8 4.8 9.5 6.5Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">PharmaChain</span>
      </div>
      <nav class="topbar-nav">
        <a href="index.html">Dashboard</a>
        <a href="batch-minting.html">Batch Minting</a>
        <a href="stakeholders.html" class="active">Stakeholders</a>
        <a href="create-staff.html" id="staff-nav-link" hidden>Staff</a>
        <a href="batches.html">Batches</a>
      </nav>
      <div class="topbar-user">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn-outline">Sign out</button>
      </div>
    </div>

    <div class="page-head">

        <div><h1>Stakeholder Management</h1>
      <p id="page-subtitle">Review and manage organizations requesting access to the network.</p>
    </div>
    <button id ="add-stakeholder-btn" class="btn-primary" hidden>+ Add Stakeholder</button>

    </div>

    <div class="filter-tabs" id="filter-tabs">
      <span class="active" data-filter="all">All</span>
      <span data-filter="pending">Pending</span>
      <span data-filter="verified">Verified</span>
      <span data-filter="rejected">Rejected</span>
    </div>


  
    <section class="panel form-panel" id="add-stakeholder-panel" hidden>
  <h2>Add Stakeholder</h2>
  <p class="form-subtitle">Create a new organization record on the network.</p>
  <form id="add-stakeholder-form">
    <div class="field-group">
      <label for="org-name">Organization Name</label>
      <input type="text" id="org-name" required placeholder="e.g. MedSupply Africa">
    </div>
    <div class="field-row">
      <div class="field-group">
        <label for="org-email">Contact Email</label>
        <input type="email" id="org-email" required placeholder="contact@example.com">
      </div>
      <div class="field-group">
        <label for="org-type">Organization Type</label>
        <input type="text" id="org-type" required placeholder="e.g. Distributor">
      </div>
    </div>
    <div class="field-group">
      <label for="org-status">Initial Status</label>
      <select id="org-status">
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
      </select>
    </div>
    <div id="add-stakeholder-error" class="error-message" hidden></div>
    <div class="stakeholder-actions">
      <button type="submit" id="add-stakeholder-submit" class="btn-primary">Save</button>
      <button type="button" id="add-stakeholder-cancel" class="btn-outline">Cancel</button>
    </div>
  </form>
</section>

    <div class="stakeholder-grid" id="stakeholder-grid">
      <p class="stakeholder-empty">Loading…</p>
    </div>

  </div>

  <script type="module" src="js/stakeholders.js"></script>
</body>
</html>
